[project]
name = "tinybi"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.138.2",
  "fastmcp>=3.4.4",
  "jinja2>=3.1.6",
  "pandas>=3.0.3",
  "python-multipart>=0.0.32",
  "uvicorn>=0.49.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
