[project]
name = "tictactoe-mcp"
version = "0.1.0"
description = "Minimal Tic-Tac-Toe game exposed through FastAPI and MCP"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.140.0",
  "fastmcp>=3.4.4",
  "pydantic>=2.13.4",
  "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
  "ipykernel>=7.3.0",
]
